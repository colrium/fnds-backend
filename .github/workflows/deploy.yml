name: Deploy Backend

on:
  push:
    branches:
      - main
      - production

env:
  AWS_REGION: af-south-1

jobs:
  set-env:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      ecr_repo: ${{ steps.env.outputs.ecr_repo }}
    steps:
      - name: Set environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "production" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "ecr_repo=fundis-production-backend" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "ecr_repo=fundis-staging-backend" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: set-env
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.environment }}
    concurrency:
      group: deploy-backend-${{ needs.set-env.outputs.environment }}
      cancel-in-progress: false
    # Maps every TF_VAR_* secret that actually has a real value set in at least one
    # GitHub Environment (staging or production). Sensitive variables in
    # infra/variables.tf default to "" when no mapping exists here, which is
    # correct for integrations an environment deliberately leaves unset (see that
    # environment's env/*.tfvars `unset_secrets` list) — but any secret an
    # environment DOES have a real value for must be mapped here, or the next
    # apply silently writes a blank value over the real one in Secrets Manager.
    #
    # Placed at job level (not workflow level) because this job carries
    # `environment:`. Environment-scoped secrets only resolve once a job's own
    # `environment:` is known — a workflow-level `env:` block is evaluated before
    # any job/environment binding exists, so `secrets.*` references there would
    # not reliably resolve for environment secrets. See GitHub Actions contexts
    # docs: workflow-level `env:` cannot see job `environment:` context; job- and
    # step-level `env:` can.
    env:
      TF_VAR_session_key: ${{ secrets.TF_VAR_SESSION_KEY }}
      TF_VAR_sendgrid_api_key: ${{ secrets.TF_VAR_SENDGRID_API_KEY }}
      TF_VAR_advanta_api_key: ${{ secrets.TF_VAR_ADVANTA_API_KEY }}
      TF_VAR_advanta_partner_id: ${{ secrets.TF_VAR_ADVANTA_PARTNER_ID }}
      TF_VAR_advanta_shortcode: ${{ secrets.TF_VAR_ADVANTA_SHORTCODE }}
      TF_VAR_mongodb_uri_override: ${{ secrets.TF_VAR_MONGODB_URI_OVERRIDE }}
      TF_VAR_cellulant_api_key: ${{ secrets.TF_VAR_CELLULANT_API_KEY }}
      TF_VAR_cellulant_access_key: ${{ secrets.TF_VAR_CELLULANT_ACCESS_KEY }}
      TF_VAR_cellulant_secret_key: ${{ secrets.TF_VAR_CELLULANT_SECRET_KEY }}
      TF_VAR_cellulant_iv_key: ${{ secrets.TF_VAR_CELLULANT_IV_KEY }}
      TF_VAR_cellulant_client_id: ${{ secrets.TF_VAR_CELLULANT_CLIENT_ID }}
      TF_VAR_cellulant_client_secret: ${{ secrets.TF_VAR_CELLULANT_CLIENT_SECRET }}
      TF_VAR_cellulant_service_code: ${{ secrets.TF_VAR_CELLULANT_SERVICE_CODE }}
      TF_VAR_turnstile_secret_key: ${{ secrets.TF_VAR_TURNSTILE_SECRET_KEY }}
      TF_VAR_slack_ops_notifs_url: ${{ secrets.TF_VAR_SLACK_OPS_NOTIFS_URL }}
      TF_VAR_betterstack_source_token: ${{ secrets.TF_VAR_BETTERSTACK_SOURCE_TOKEN }}
      TF_VAR_stytch_project_id: ${{ secrets.TF_VAR_STYTCH_PROJECT_ID }}
      TF_VAR_stytch_secret: ${{ secrets.TF_VAR_STYTCH_SECRET }}
      TF_VAR_stytch_webhook_secret: ${{ secrets.TF_VAR_STYTCH_WEBHOOK_SECRET }}
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        working-directory: .
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPO: ${{ needs.set-env.outputs.ecr_repo }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG

      # Terraform reads this parameter to decide which image the service should
      # run, so it must point at the build being deployed here — otherwise the
      # next `terraform apply` would roll the service back. Storing a digest
      # rather than a tag keeps the reference immutable.
      - name: Publish image digest to SSM
        working-directory: .
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPO: ${{ needs.set-env.outputs.ecr_repo }}
          IMAGE_TAG: ${{ github.sha }}
          ENVIRONMENT: ${{ needs.set-env.outputs.environment }}
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name $ECR_REPO \
            --image-ids imageTag=$IMAGE_TAG \
            --query 'imageDetails[0].imageDigest' \
            --output text \
            --region $AWS_REGION)

          aws ssm put-parameter \
            --name "/fundis/$ENVIRONMENT/backend/image" \
            --value "$ECR_REGISTRY/$ECR_REPO@$DIGEST" \
            --type String \
            --overwrite \
            --region $AWS_REGION

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false -backend-config="key=backend/${{ needs.set-env.outputs.environment }}/terraform.tfstate"

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve -var-file="env/${{ needs.set-env.outputs.environment }}.tfvars"
