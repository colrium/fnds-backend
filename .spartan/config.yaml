# .spartan/config.yaml — Generated by /spartan:init-rules
# Validate: /spartan:lint-rules
# Auto-detect rules from code: /spartan:scan-rules

# ─── Stack & Architecture ───────────────────────────────────────────

stack: go-standard
architecture: clean

# ─── Rules ──────────────────────────────────────────────────────────

rules:
  shared:
    - rules/auto-detected/UUID_PRIMARY_KEYS.md
    - rules/auto-detected/TIMESTAMP_FIELDS.md
    - rules/auto-detected/JSON_BSON_TAGS.md
    - rules/auto-detected/RESPONSE_ENVELOPE.md
    - rules/auto-detected/TABLE_DRIVEN_TESTS.md
    - rules/auto-detected/VALIDATION_FUNCTIONS.md
    - rules/auto-detected/ROUTE_REGISTRATION.md
    - rules/auto-detected/CONTEXT_USER_ID.md
    - rules/auto-detected/ERROR_HANDLING_STYLE.md

  backend: []
    # Add backend-specific rules

  frontend: []

# ─── File Type Mapping ──────────────────────────────────────────────

file-types:
  backend: [".go"]
  frontend: []
  migration: [".sql"]
  config: [".yaml", ".yml", ".json", ".toml", ".env"]

# ─── Review Stages ──────────────────────────────────────────────────

review-stages:
  - correctness
  - stack-conventions
  - test-coverage
  - architecture
  - database-api
  - security
  - documentation-gaps

# ─── Build Commands ─────────────────────────────────────────────────

commands:
  test:
    backend: "go test ./..."
    frontend: ""
  build:
    backend: "go build -o main main.go"
    frontend: ""
  lint:
    backend: "golangci-lint run"
    frontend: ""
